<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gomoku AI — Cờ Caro</title>
  <style>
    /* ── Design: Industrial Monochrome with accent amber ── */
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap');

    :root {
      --bg:        #0e0e0e;
      --surface:   #161616;
      --border:    #2a2a2a;
      --text:      #e8e8e0;
      --muted:     #666;
      --amber:     #f5a623;
      --amber-dim: rgba(245,166,35,0.15);
      --red:       #e05252;
      --green:     #4ecf7a;
      --cell:      40px;
      --gap:       3px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Space Mono', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow-x: hidden;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 2rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .logo span { color: var(--amber); }

    .meta {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    /* ── Main layout ── */
    main {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 0;
      height: calc(100vh - 70px - 44px);
    }

    /* ── Sidebar ── */
    aside {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 1.5rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      overflow-y: auto;
    }

    .section-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--amber);
      margin-bottom: 0.5rem;
    }

    .status-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.85rem 1rem;
    }
    .status-text {
      font-size: 0.82rem;
      line-height: 1.5;
      min-height: 2.5rem;
    }
    .status-text.win  { color: var(--green); }
    .status-text.lose { color: var(--red); }
    .status-text.draw { color: var(--amber); }

    /* Controls */
    .control-group { display: flex; flex-direction: column; gap: 0.6rem; }

    select, button {
      font-family: 'Space Mono', monospace;
      font-size: 0.8rem;
      padding: 0.6rem 0.9rem;
      border-radius: 3px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    select:hover, button:hover { border-color: var(--amber); }
    select:focus, button:focus { outline: none; border-color: var(--amber); }

    button.primary {
      background: var(--amber);
      color: #000;
      font-weight: 700;
      border-color: var(--amber);
    }
    button.primary:hover { background: #ffc145; }
    button.primary:disabled { opacity: 0.4; cursor: not-allowed; }

    button.ghost {
      background: transparent;
      color: var(--muted);
    }
    button.ghost:hover { color: var(--text); border-color: #444; }

    /* Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }
    .stat-cell {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 0.6rem 0.75rem;
    }
    .stat-val {
      font-family: 'Syne', sans-serif;
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--amber);
    }
    .stat-lbl {
      font-size: 0.62rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 0.1rem;
    }

    /* Move history */
    #history-list {
      list-style: none;
      font-size: 0.72rem;
      color: var(--muted);
      max-height: 130px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: var(--bg);
    }
    #history-list li {
      padding: 0.3rem 0.75rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
    }
    #history-list li:last-child { border-bottom: none; }
    #history-list .move-actor { color: var(--text); }

    /* Avg depth bar */
    .depth-bar-track {
      height: 6px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 0.4rem;
    }
    .depth-bar-fill {
      height: 100%;
      background: var(--amber);
      border-radius: 99px;
      transition: width 0.4s ease;
      width: 0%;
    }

    /* ── Board area ── */
    .board-area {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
    }

    #board-wrap {
      position: relative;
    }

    /* Grid lines behind cells */
    #grid-lines {
      position: absolute;
      inset: calc(var(--cell)/2);
      pointer-events: none;
    }

    canvas#grid-canvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(15, var(--cell));
      grid-template-rows: repeat(15, var(--cell));
      gap: var(--gap);
      position: relative;
      z-index: 1;
    }

    .cell {
      width: var(--cell);
      height: var(--cell);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: background 0.1s;
    }
    .cell:hover::after {
      content: '';
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      background: rgba(245,166,35,0.25);
    }
    .cell.occupied { cursor: default; }
    .cell.occupied:hover::after { display: none; }

    /* Stones */
    .stone {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      position: relative;
      z-index: 2;
      transition: transform 0.12s cubic-bezier(.34,1.56,.64,1);
      animation: pop-in 0.18s cubic-bezier(.34,1.56,.64,1) both;
    }

    @keyframes pop-in {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }

    .stone-black {
      background: radial-gradient(circle at 35% 30%, #555, #111);
      box-shadow: 0 2px 8px rgba(0,0,0,0.7), inset 0 1px 1px rgba(255,255,255,0.1);
    }
    .stone-white {
      background: radial-gradient(circle at 35% 30%, #fff, #ccc);
      box-shadow: 0 2px 8px rgba(0,0,0,0.5), inset 0 1px 2px rgba(255,255,255,0.9);
    }

    .stone.last-move::after {
      content: '';
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      background: var(--amber);
      opacity: 0.9;
    }

    /* Thinking overlay */
    .thinking-dot {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--amber);
      animation: blink 0.8s infinite alternate;
    }
    @keyframes blink { from { opacity: 0.2; } to { opacity: 1; } }

    /* Game over overlay */
    #result-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(14,14,14,0.85);
      border-radius: 4px;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1rem;
      z-index: 10;
    }
    #result-overlay.show { display: flex; }
    #result-title {
      font-family: 'Syne', sans-serif;
      font-size: 2.5rem;
      font-weight: 800;
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding: 0.6rem 2rem;
      font-size: 0.65rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Responsive */
    @media (max-width: 860px) {
      main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      aside { flex-direction: row; flex-wrap: wrap; padding: 1rem; height: auto; overflow: visible; }
      aside > * { flex: 1 1 180px; }
    }
    @media (max-width: 540px) {
      :root { --cell: 22px; --gap: 2px; }
      .stone { width: 18px; height: 18px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Gomoku <span>AI</span></div>
  <div class="meta">Minimax · Alpha-Beta · PVS · Incremental Eval</div>
</header>

<main>
  <!-- ── Sidebar ── -->
  <aside>
    <div>
      <div class="section-label">Trạng thái</div>
      <div class="status-box">
        <div id="status-text" class="status-text">Nhấn "Ván mới" để bắt đầu.</div>
      </div>
    </div>

    <div class="control-group">
      <div class="section-label">Độ khó</div>
      <select id="difficulty">
        <option value="easy">Easy — depth 2</option>
        <option value="medium" selected>Medium — depth 3</option>
        <option value="hard">Hard — depth 4</option>
      </select>
      <div class="section-label" style="margin-top:0.5rem">Người chơi</div>
      <select id="player-color">
        <option value="black">Đen (đi trước)</option>
        <option value="white">Trắng (đi sau)</option>
      </select>
      <button class="primary" id="btn-new">▶ Ván mới</button>
      <button class="ghost" id="btn-undo">↩ Hoàn tác</button>
    </div>

    <div>
      <div class="section-label">Thống kê</div>
      <div class="stats-grid">
        <div class="stat-cell">
          <div class="stat-val" id="stat-depth">—</div>
          <div class="stat-lbl">Độ sâu</div>
        </div>
        <div class="stat-cell">
          <div class="stat-val" id="stat-eval">—</div>
          <div class="stat-lbl">Eval</div>
        </div>
        <div class="stat-cell">
          <div class="stat-val" id="stat-move">—</div>
          <div class="stat-lbl">Nước</div>
        </div>
        <div class="stat-cell">
          <div class="stat-val" id="stat-avg">—</div>
          <div class="stat-lbl">TB Depth</div>
        </div>
      </div>
      <div class="depth-bar-track" style="margin-top:0.6rem">
        <div class="depth-bar-fill" id="depth-bar"></div>
      </div>
    </div>

    <div>
      <div class="section-label">Lịch sử nước đi</div>
      <ul id="history-list"></ul>
    </div>

    <div>
      <div class="section-label">AI Reason</div>
      <div class="status-box" style="min-height:2rem">
        <div id="reason-text" style="font-size:0.75rem;color:var(--amber)">—</div>
      </div>
    </div>
  </aside>

  <!-- ── Board ── -->
  <div class="board-area">
    <div id="board-wrap">
      <canvas id="grid-canvas"></canvas>
      <div id="board"></div>
      <div id="result-overlay">
        <div id="result-title"></div>
        <button class="primary" id="btn-overlay-new">Chơi lại</button>
      </div>
    </div>
  </div>
</main>

<footer>
  <span>gomoku_ai · frontend_web</span>
  <span id="footer-thinking"></span>
</footer>

<script>
/* ── Constants ── */
const SIZE = 15;
const API  = '';  // same origin via proxy; adjust if needed
const MAX_DEPTH_DISPLAY = 5;

/* ── State ── */
let board        = [];
let gameOver     = false;
let playerColor  = 'black';  // 'black'=player goes first (stone -1), 'white'=AI first
let playerStone  = -1;       // -1 = human stone value
let aiStone      = 1;
let moveCount    = 0;
let moveHistory  = [];
let avgDepth     = 0;
let isThinking   = false;
let difficulty   = 'medium';

/* ── DOM refs ── */
const boardEl    = document.getElementById('board');
const statusEl   = document.getElementById('status-text');
const reasonEl   = document.getElementById('reason-text');
const historyEl  = document.getElementById('history-list');
const depthEl    = document.getElementById('stat-depth');
const evalEl     = document.getElementById('stat-eval');
const moveEl     = document.getElementById('stat-move');
const avgEl      = document.getElementById('stat-avg');
const depthBar   = document.getElementById('depth-bar');
const footerThk  = document.getElementById('footer-thinking');
const resultOvrl = document.getElementById('result-overlay');
const resultTitle= document.getElementById('result-title');
const canvas     = document.getElementById('grid-canvas');

/* ── Init board data ── */
function emptyBoard() {
  return Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
}

/* ── Render grid lines on canvas ── */
function renderGrid() {
  const CELL = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--cell')) || 40;
  const GAP  = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--gap'))  || 3;
  const step = CELL + GAP;
  const total = SIZE * step - GAP;
  canvas.width  = total;
  canvas.height = total;
  const ctx = canvas.getContext('2d');
  ctx.strokeStyle = '#2a2a2a';
  ctx.lineWidth = 1;
  for (let i = 0; i < SIZE; i++) {
    const pos = i * step + CELL / 2;
    ctx.beginPath(); ctx.moveTo(pos, CELL / 2); ctx.lineTo(pos, total - CELL / 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(CELL / 2, pos); ctx.lineTo(total - CELL / 2, pos); ctx.stroke();
  }
  // Star points
  const stars = [[3,3],[3,7],[3,11],[7,3],[7,7],[7,11],[11,3],[11,7],[11,11]];
  ctx.fillStyle = '#444';
  stars.forEach(([r,c]) => {
    const x = c * step + CELL / 2;
    const y = r * step + CELL / 2;
    ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
  });
}

/* ── Build cell DOM ── */
function buildBoard() {
  boardEl.innerHTML = '';
  board = emptyBoard();
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.r = r;
      cell.dataset.c = c;
      cell.addEventListener('click', onCellClick);
      boardEl.appendChild(cell);
    }
  }
}

/* ── Get cell element ── */
function getCell(r, c) {
  return boardEl.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
}

/* ── Place stone visually ── */
function placeStone(r, c, stone, isLast = false) {
  const cell = getCell(r, c);
  if (!cell) return;
  cell.classList.add('occupied');
  const s = document.createElement('div');
  s.className = `stone ${stone === 1 ? 'stone-white' : 'stone-black'}`;
  if (isLast) s.classList.add('last-move');
  cell.appendChild(s);
}

/* ── Remove last-move highlight ── */
function clearLastMoveHighlight() {
  document.querySelectorAll('.stone.last-move').forEach(el => el.classList.remove('last-move'));
}

/* ── Status helpers ── */
function setStatus(msg, cls = '') {
  statusEl.textContent = msg;
  statusEl.className = `status-text ${cls}`;
}

/* ── History ── */
function addHistory(actor, r, c, reason = '') {
  const li = document.createElement('li');
  const col = String.fromCharCode(65 + c);
  li.innerHTML = `<span class="move-actor">${actor}</span><span>${col}${r + 1}${reason ? ' · ' + reason.replace(/_/g,' ') : ''}</span>`;
  historyEl.prepend(li);
}

/* ── Win check (mirror of backend) ── */
function checkWin(bd, stone) {
  const dirs = [[1,0],[0,1],[1,1],[1,-1]];
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (bd[r][c] !== stone) continue;
      for (const [dr,dc] of dirs) {
        let cnt = 0;
        for (let s = 0; s < 5; s++) {
          const nr = r + dr*s, nc = c + dc*s;
          if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE || bd[nr][nc] !== stone) break;
          cnt++;
        }
        if (cnt === 5) return true;
      }
    }
  }
  return false;
}

function isFull(bd) {
  return bd.every(row => row.every(c => c !== 0));
}

/* ── Start a new game ── */
function startGame() {
  buildBoard();
  renderGrid();
  moveCount = 0;
  moveHistory = [];
  gameOver = false;
  isThinking = false;
  historyEl.innerHTML = '';
  resultOvrl.classList.remove('show');
  difficulty   = document.getElementById('difficulty').value;
  playerColor  = document.getElementById('player-color').value;
  playerStone  = playerColor === 'black' ? -1 : 1;
  aiStone      = -playerStone;
  depthEl.textContent = '—';
  evalEl.textContent  = '—';
  moveEl.textContent  = '0';
  reasonEl.textContent = '—';
  setStatus(playerColor === 'black' ? 'Lượt bạn (●).' : 'AI đang suy nghĩ…');
  footerThk.textContent = '';
  if (playerColor === 'white') {
    // AI moves first
    void requestAiMove();
  }
}

/* ── Handle cell click ── */
function onCellClick(e) {
  if (gameOver || isThinking) return;
  const r = +e.currentTarget.dataset.r;
  const c = +e.currentTarget.dataset.c;
  if (board[r][c] !== 0) return;

  clearLastMoveHighlight();
  board[r][c] = playerStone;
  placeStone(r, c, playerStone, true);
  moveCount++;
  moveEl.textContent = moveCount;
  addHistory('Bạn', r, c);
  moveHistory.push({ r, c, stone: playerStone });

  if (checkWin(board, playerStone)) {
    endGame('Bạn thắng! 🎉', 'win');
    return;
  }
  if (isFull(board)) {
    endGame('Hòa!', 'draw');
    return;
  }
  void requestAiMove();
}

/* ── Request AI move from backend ── */
async function requestAiMove() {
  isThinking = true;
  setStatus('AI đang suy nghĩ… ');
  footerThk.innerHTML = '<span class="thinking-dot"></span> đang tính…';

  try {
    const res = await fetch(`${API}/api/get-move`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ board, player: aiStone, difficulty })
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    // Update stats
    if (data.completed_depth != null) {
      depthEl.textContent = data.completed_depth;
      const pct = Math.min(100, (data.completed_depth / MAX_DEPTH_DISPLAY) * 100);
      depthBar.style.width = `${pct}%`;
    }
    if (data.evaluation != null) {
      const ev = data.evaluation;
      evalEl.textContent = ev > 0 ? `+${ev}` : `${ev}`;
    }
    if (data.reason) reasonEl.textContent = data.reason.replace(/_/g, ' ');

    // Avg depth from server response (stats_tracker)
    if (data.avg_depth != null) {
      avgDepth = data.avg_depth;
      avgEl.textContent = avgDepth.toFixed(1);
    }

    if (data.row == null || data.col == null) {
      endGame('Hòa!', 'draw');
      return;
    }

    clearLastMoveHighlight();
    const { row, col } = data;
    board[row][col] = aiStone;
    placeStone(row, col, aiStone, true);
    moveCount++;
    moveEl.textContent = moveCount;
    addHistory('AI', row, col, data.reason);
    moveHistory.push({ r: row, c: col, stone: aiStone });

    if (checkWin(board, aiStone)) {
      endGame('AI thắng!', 'lose');
      return;
    }
    if (isFull(board)) {
      endGame('Hòa!', 'draw');
      return;
    }

    setStatus('Lượt bạn.');
    footerThk.textContent = '';
  } catch (err) {
    setStatus(`Lỗi: ${err.message}`, '');
    footerThk.textContent = 'Backend không phản hồi';
  } finally {
    isThinking = false;
  }
}

/* ── End game ── */
function endGame(msg, cls) {
  gameOver = true;
  setStatus(msg, cls);
  footerThk.textContent = '';
  resultTitle.textContent = msg;
  resultTitle.style.color = cls === 'win' ? 'var(--green)' : cls === 'lose' ? 'var(--red)' : 'var(--amber)';
  resultOvrl.classList.add('show');
}

/* ── Undo ── */
function undoMove() {
  if (gameOver || isThinking || moveHistory.length < 2) return;
  for (let i = 0; i < 2; i++) {
    const last = moveHistory.pop();
    if (!last) continue;
    board[last.r][last.c] = 0;
    const cell = getCell(last.r, last.c);
    if (cell) { cell.classList.remove('occupied'); cell.innerHTML = ''; }
    historyEl.removeChild(historyEl.firstChild);
    moveCount--;
  }
  moveEl.textContent = moveCount;
  setStatus('Đã hoàn tác. Lượt bạn.');
  clearLastMoveHighlight();
  // Re-highlight the new last move
  if (moveHistory.length > 0) {
    const last = moveHistory[moveHistory.length - 1];
    const cell = getCell(last.r, last.c);
    if (cell) {
      const stone = cell.querySelector('.stone');
      if (stone) stone.classList.add('last-move');
    }
  }
}

/* ── Event listeners ── */
document.getElementById('btn-new').addEventListener('click', startGame);
document.getElementById('btn-overlay-new').addEventListener('click', startGame);
document.getElementById('btn-undo').addEventListener('click', undoMove);

/* ── Init on load ── */
buildBoard();
renderGrid();
setStatus('Nhấn "Ván mới" để bắt đầu.');
</script>
</body>
</html>
